# Curated package catalog for the Insignia NS75-UQFL26 (Fire OS 8.1.8.5).
# Every package here is on data/device_packages.txt (from recon, Fire OS 8.1.8.5).
# Tiers: safe = telemetry, ads, promos, preinstalled extras; moderate = background
# services that may break something; features are off by default (spec section 9).
# Excluded on purpose: see the PR description, "Considered, not included".
#
# Removed on purpose (R18): these were tested on Fire OS 8.1.8.5 (RS8185/3898) on
# 2026-11-21 and do not work on this TV. Do not add them back.
#   com.amazon.ftvads.deeplinking           Fire OS refuses: protected package
#   com.amazon.device.crashmanager          Fire OS refuses: protected package
#   com.amazon.device.logmanager            Fire OS refuses: protected package
#   com.amazon.device.metrics               Fire OS refuses: protected package
#   com.amazon.device.messaging             Fire OS refuses: protected package
#   com.amazon.tcomm                        Fire OS refuses: protected package
#   com.amazon.tv.csapp                     Fire OS refuses: protected package
#   com.amazon.device.software.ota          Fire OS refuses: protected package
#   com.amazon.device.software.ota.override Fire OS refuses: protected package
#   com.amazon.vizzini                      re-enabled by Fire OS at every boot

# ---- preinstalled extras (/data/app): pulled to backup, then uninstalled --user 0 ----

[[package]]
name = "com.instagram.airwave"
action = "disable"
tier = "safe"
reason = "Preinstalled Instagram app from Amazon; disabled, not uninstalled, not needed on the TV"

[[package]]
name = "com.roku.web.trc"
action = "disable"
tier = "safe"
reason = "Preinstalled The Roku Channel app; disabled, not uninstalled, since it registers a TV input"

[[package]]
name = "tv.pluto.android"
action = "disable"
tier = "safe"
reason = "Preinstalled Pluto TV app; disabled, not uninstalled, since it registers a TV input"

