# ---- moderate: non-essential background or helper services, risk named ----

[[package]]
name = "com.amazon.device.messaging"
action = "disable"
tier = "moderate"
reason = "Amazon Device Messaging (ADM) push service; may break app notifications, Appstore update notices, or account/device sync"

[[package]]
name = "com.amazon.tcomm"
action = "disable"
tier = "moderate"
reason = "Amazon communication hub for device sync, ADM and DCP traffic; may break device registration/sync, Amazon app push, or Prime Video features"

[[package]]
name = "com.amazon.media.recommendations"
action = "disable"
tier = "moderate"
reason = "Supplies Home screen recommendation rows; may break those rows (they may come up empty) or continue-watching"

[[package]]
name = "com.amazon.hybridadidservice"
action = "disable"
tier = "moderate"
reason = "Advertising ID service; may break or cause errors in apps that request the advertising ID"

[[package]]
name = "com.amazon.tmm.tutorial"
action = "disable"
tier = "moderate"
reason = "On-screen tutorial app; may break only the built-in tutorial screens"

[[package]]
name = "com.amazon.storm.lightning.tutorial"
action = "disable"
tier = "moderate"
reason = "On-screen tutorial app; may break only the built-in tutorial screens"

[[package]]
name = "com.amazon.tv.releasenotes"
action = "disable"
tier = "moderate"
reason = "Shows release notes after updates; may break only that screen"

[[package]]
name = "com.amazon.tv.csapp"
action = "disable"
tier = "moderate"
reason = "Built-in help videos; may break only the help screens"

[[package]]
name = "com.amazon.ods.kindleconnect"
action = "disable"
tier = "moderate"
reason = "Mayday support screen sharing; may break Amazon support sessions only"

