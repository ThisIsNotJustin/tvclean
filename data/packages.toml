# ---- feature airplay: off by default ----

[[package]]
name = "com.apple.airplay.amazon.airplay"
action = "disable"
feature = "airplay"
reason = "AirPlay receiver companion app; only used for AirPlay casting from Apple devices"

# ---- feature updates: off by default (exactly the three OTA packages) ----

[[package]]
name = "com.amazon.device.software.ota"
action = "disable"
feature = "updates"
reason = "Amazon over-the-air system update client; turning it off stops automatic updates"

[[package]]
name = "com.amazon.device.software.ota.override"
action = "disable"
feature = "updates"
reason = "OTA idle override that lets system updates install; turning it off stops updates"

[[package]]
name = "com.amazon.tv.forcedotaupdater.v2"
action = "disable"
feature = "updates"
reason = "Forced OTA update checker; turning it off stops forced updates"
