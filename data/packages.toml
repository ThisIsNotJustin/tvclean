[[package]]
name = "com.amazon.perfcollection"
action = "disable"
tier = "safe"
reason = "Performance data collection that reports usage metrics to Amazon"

[[package]]
name = "com.amazon.device.telemetry.emitter"
action = "disable"
tier = "safe"
reason = "Telemetry emitter that sends device event data to Amazon"

[[package]]
name = "com.amazon.device.metrics"
action = "disable"
tier = "safe"
